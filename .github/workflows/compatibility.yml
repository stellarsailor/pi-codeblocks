name: Compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # Types come from the newest Pi; older releases keep some APIs untyped or absent.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install Pi, TypeScript and Node types
        run: >-
          npm install --no-save --package-lock=false
          "@earendil-works/pi-coding-agent@latest"
          "@earendil-works/pi-tui@latest"
          typescript@5
          @types/node@22
      - run: npm run typecheck

  render:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # An explicit list, not a cross product: macOS arm64 runners queue for many minutes under
      # capacity constraints and queued jobs get cancelled, which reddens the whole run. Ubuntu
      # carries the full Pi x Node grid, and macOS and Windows only need their clipboard branch
      # (pbcopy, clip.exe) checked on the oldest and newest pairing.
      matrix:
        include:
          # Pi needs Node >= 22.19. 24 is the next LTS; 26 is current.
          - { os: ubuntu-latest, node: '22.19.0', pi: '0.79.9' }
          - { os: ubuntu-latest, node: '22.19.0', pi: '1.5.0' }
          - { os: ubuntu-latest, node: '22.19.0', pi: latest }
          - { os: ubuntu-latest, node: '24', pi: '0.79.9' }
          - { os: ubuntu-latest, node: '24', pi: '1.5.0' }
          - { os: ubuntu-latest, node: '24', pi: latest }
          - { os: ubuntu-latest, node: '26', pi: latest }
          - { os: macos-latest, node: '24', pi: latest }
          - { os: macos-latest, node: '22.19.0', pi: '0.79.9' }
          - { os: windows-latest, node: '24', pi: latest }
          - { os: windows-latest, node: '22.19.0', pi: '0.79.9' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # One install call: a second `npm install --no-save` would prune the first.
      - name: Install Pi ${{ matrix.pi }}
        run: >-
          npm install --no-save --package-lock=false
          "@earendil-works/pi-coding-agent@${{ matrix.pi }}"
          "@earendil-works/pi-tui@${{ matrix.pi }}"
      - run: npm test
